name: Build & Release Chime Launcher APK

on:
  push:
    branches:
      - main
      - "feature/google-discover-*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to verify/publish (leave empty for a build only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Run Unit Tests
    runs-on: ubuntu-latest
    env:
      HAS_DISTRIBUTION_KEY: ${{ secrets.CHIME_KEYSTORE_BASE64 != '' }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || '' }}

    steps:
      - name: Require distribution signing key for a tagged release
        if: env.RELEASE_TAG != '' && env.HAS_DISTRIBUTION_KEY != 'true'
        run: |
          echo "::error::A tagged release requires CHIME_KEYSTORE_BASE64; refusing to report an unpublished release as successful."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore distribution signing key
        if: env.HAS_DISTRIBUTION_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CHIME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CHIME_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.CHIME_KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.CHIME_KEY_PASSWORD || 'android' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chime.keystore"
          echo "CHIME_KEYSTORE_PATH=$RUNNER_TEMP/chime.keystore" >> "$GITHUB_ENV"
          echo "CHIME_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CHIME_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CHIME_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Unit Tests & Assemble Release/Debug APKs
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :discover-companion:assembleRelease

      - name: Verify tagged APK versions and shared signing certificate
        if: env.RELEASE_TAG != ''
        run: |
          python3 - <<'PY_CHECK'
          import os
          from pathlib import Path
          import re
          import subprocess

          release_tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-preview[.\d]*)?", release_tag):
              raise SystemExit(f"Unsupported release tag: {release_tag}")
          expected = release_tag.removeprefix("v")
          tool_dirs = list((Path(os.environ["ANDROID_HOME"]) / "build-tools").iterdir())
          tools = max((p for p in tool_dirs if (p / "aapt").is_file() and (p / "apksigner").is_file()),
                      key=lambda p: tuple(int(n) for n in re.findall(r"\d+", p.name)))
          certificates = []
          packages = [("app/build/outputs/apk/release/app-release.apk", "com.myenvironment.launcher"),
                      ("discover-companion/build/outputs/apk/release/discover-companion-release.apk", "com.myenvironment.chimediscoverbridge")]
          for apk, package in packages:
              badging = subprocess.check_output([str(tools / "aapt"), "dump", "badging", apk], text=True)
              actual_package = re.search(r"package: name='([^']+)'", badging).group(1)
              actual_version = re.search(r"versionName='([^']+)'", badging).group(1)
              if actual_package != package or actual_version != expected:
                  raise SystemExit(f"APK metadata mismatch: {apk}: {actual_package} {actual_version}; expected {package} {expected}")
              signing = subprocess.check_output([str(tools / "apksigner"), "verify", "--print-certs", apk], text=True)
              # Signer labels vary across apksigner versions (number, SDK range, etc.).
              for line in signing.splitlines():
                  if "certificate SHA-256 digest:" in line:
                      print("apksigner certificate label:", line.split(" certificate SHA-256 digest:", 1)[0])
              apk_certificates = {digest.lower() for digest in re.findall(
                  r"^[ \t]*Signer[^\r\n]* certificate SHA-256 digest: ([0-9a-fA-F]{64})[ \t\r]*$",
                  signing, re.MULTILINE)}
              if len(apk_certificates) != 1:
                  raise SystemExit(f"Expected one signing certificate in apksigner output: {apk}")
              certificates.append(apk_certificates.pop())
              print(f"Verified {apk}: {actual_package} v{actual_version}")
          if len(set(certificates)) != 1:
              raise SystemExit("Launcher and Companion signing certificates differ")
          PY_CHECK

      - name: Prepare APK artifacts for distribution
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChimeLauncher-latest.apk
          cp discover-companion/build/outputs/apk/release/discover-companion-release.apk ChimeDiscoverCompanion-latest.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChimeLauncher-APK
          path: |
            ChimeLauncher-latest.apk
            ChimeDiscoverCompanion-latest.apk

      - name: Publish to GitHub Releases (tag push or selected tag)
        if: env.RELEASE_TAG != '' && env.HAS_DISTRIBUTION_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          APK_RELEASE="ChimeLauncher-${TAG_NAME}.apk"
          APK_COMPANION="ChimeDiscoverCompanion-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_RELEASE}"
          cp discover-companion/build/outputs/apk/release/discover-companion-release.apk "${APK_COMPANION}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; keeping its verified APKs unchanged."
          else
            EXTRA_ARGS=()
            if [[ "$TAG_NAME" == *preview* ]]; then
              EXTRA_ARGS+=(--prerelease --latest=false)
            else
              # Do not let an older tag replace an already newer public release.
              CURRENT_LATEST=$(gh api repos/tnk962/ChimeLauncher/releases/latest --jq .tag_name)
              CURRENT_LATEST="$CURRENT_LATEST" RELEASE_TAG="$TAG_NAME" python3 - <<'PY_ORDER'
          import os
          import re
          def version(value):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", value)
              if not match:
                  raise SystemExit(f"Unsupported stable release tag: {value}")
              return tuple(map(int, match.groups()))
          if version(os.environ["RELEASE_TAG"]) <= version(os.environ["CURRENT_LATEST"]):
              raise SystemExit("Refusing to replace latest with an equal or older release")
          PY_ORDER
              EXTRA_ARGS+=(--latest)
            fi
            gh release create "${TAG_NAME}" "${APK_RELEASE}" "${APK_COMPANION}" \
              --title "Chime Launcher ${TAG_NAME}" \
              --verify-tag --generate-notes "${EXTRA_ARGS[@]}"
          fi
